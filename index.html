<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumbbell Plot: 2022 vs 2024</title>

  <!-- Highcharts core + modules needed for the dumbbell series -->
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/highcharts-more.js"></script>
  <script src="https://code.highcharts.com/modules/dumbbell.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/accessibility.js"></script>

  <style>
    /* Fill the iframe completely */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Chart on the left, table on the right, both full height */
    #layout {
      display: flex;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      min-height: 300px;
    }
    #container {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }
    #table-wrap {
      flex: 0 0 auto;
      width: 280px;            /* table width – change as needed */
      height: 100%;
      padding-right: 10px;
      box-sizing: border-box;
    }

    /* Table styling. Rows have no vertical padding or borders so their
       height matches the chart's category bands exactly (set by plot.js). */
    #data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      color: #000;
    }
    #data-table th {
      padding: 0 6px 6px;
      font-weight: bold;
      text-align: center;
      vertical-align: bottom;
      border-bottom: 2px solid #999;
    }
    #data-table td {
      padding: 0 6px;
      text-align: center;
      vertical-align: middle;
    }
    /* Black line between category rows. Drawn with an inset shadow instead of
       a border, so it adds no height and the rows stay aligned with the chart.
       Change "1px" for thickness and "#000" for color. */
    /*#data-table tbody tr:not(:last-child) td { */
    #data-table tbody tr td {
      box-shadow: inset 0 -1px 0 #000;
    }
  </style>
</head>
<body>
  <div id="layout">
    <div id="container"></div>
    <div id="table-wrap">
      <table id="data-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="plot.js"></script>
</body>
</html>
